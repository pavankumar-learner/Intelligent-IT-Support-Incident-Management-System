# Application Configuration
spring.application.name=itsupport
server.port=8080

# Primary Database Configuration: H2 In-Memory (Zero setup requirement for student laptop evaluation)
spring.datasource.url=jdbc:h2:mem:itsupportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Production Configuration (Uncomment to use real MySQL server)
# spring.datasource.url=jdbc:mysql://localhost:3306/itsupport_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For MySQL, use:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Secrets
app.jwt.secret=9a2f8c4e7b1d3f5a6c8e0b2d4f6a8c1e3f5a7b9c0d2e4f6a8b0c2d4e6f8a0b2c
app.jwt.expiration-ms=86400000

# Machine Learning FastAPI Microservice URL
ml.service.url=http://localhost:8000
